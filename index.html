   Phase 1（主人公1・銃1・敵2種・部屋グリッド・止まると撃つ・ダッシュ）の上に、
   フロア3＋ボスフロア／部屋7〜12・商人・宝物庫／扉に報酬を表示して選ぶ／ラン内成長（義体×銃改造）／
   スクラップ（素材）／中断セーブ（シード＋部屋の進捗＝部屋に入った時点へ戻る）を載せた。
   操作: 画面のどこでも触れた所が仮想スティックの中心。動く＝避ける／止まる＝撃つ（自動照準）／フリック＝ダッシュ
   ===================================================================== */
const VERSION = 'p2-0.1.0';

// ---------- 定数 ----------
const TILE = 32, COLS = 12, ROWS = 18, RW = COLS * TILE, RH = ROWS * TILE;   // 部屋＝12×18タイル（外周は壁）
const GRID = 5;                                                                 // 部屋グリッド 5×5（Phase 2＝部屋7〜12を置くため 4×4 から拡張）
const DIRS = { N: { dx: 0, dy: -1 }, S: { dx: 0, dy: 1 }, W: { dx: -1, dy: 0 }, E: { dx: 1, dy: 0 } };
const OPP = { N: 'S', S: 'N', W: 'E', E: 'W' };
// 手触りの調整値（遊びながら動かす場所はここに集約）
const TUNE = {
  player:  { hp: 5, spd: 175, fireRate: 0.14, bulletSpd: 700, range: 300, inv: 0.9, stopFire: 0 }, // 速さ／連射間隔(秒)／弾速／射程／被弾後の無敵(秒)／止まってから初弾までの待ち(秒)
  dash:    { spd: 640, t: 0.16, cool: 0.5, inv: true, tapT: 0.18, tapMove: 14, flickV: 350, flickDist: 20, flickWin: 120, flickGap: 120 }, // ダッシュ: 速度／時間(秒)／再使用まで(秒)／無敵か／タップ判定=触れてから離すまで(秒)・指の移動(px)／フリック判定=離す直前 flickWin ms の移動が flickDist px 以上かつ flickV px/秒以上（指を止めて flickGap ms 以上たって離したら不成立）。p1-0.2.2 で確定（2026-09-11 マスター「ダッシュ良い感じです」）
  ui:      { fallbackSat: 59, fallbackSab: 34 },                                                  // ホーム画面版で safe-area が 0 と読めた時の保険（Phase 0 の iPhone 15 実測値）
  rusher:  { hp: 4, spd: 95, tellDist: 200, tellT: 0.45, dashSpd: 520, dashT: 0.4, restT: 0.75 }, // 突進型: 予兆に入る距離／予兆(秒)／突進速度・時間／硬直
  shooter: { hp: 2, spd: 70, near: 130, far: 300, aimT: 0.55, lockT: 0.18, bulletSpd: 230, coolT: 1.1, nearMax: 0.6 }, // 射撃型: 近すぎ→下がる（nearMax 秒以上続いたら至近で撃つ）／狙い(秒)／照準ロック(残り秒)／弾速／再装填
  room:    { bonusFrom: 3, spawnDist: 170 },                                                      // 3部屋目以降は敵+1／主人公からの最短出現距離
  // フロアごとの差分（Phase 2）。rooms＝部屋数の範囲／room＝1部屋の敵＝base+0..rand-1（上限max）／hp＝敵HPの加算。フロア1は Phase 1 と同じ値（難度はマスター判断で据え置き）
  floors: [
    { rooms: [7, 9],   room: { base: 3, rand: 3, max: 6 }, hp: 0 },
    { rooms: [8, 10],  room: { base: 4, rand: 3, max: 7 }, hp: 0 },
    { rooms: [9, 12],  room: { base: 4, rand: 4, max: 8 }, hp: 1 },
    { boss: true },
  ],
  boss:    { hp: 220, hpPerMod: 0.35, r: 26, spd: 55, tell: 0.7, rest: 0.9, ringN: 12, ringSpd: 175, chargeSpd: 560, chargeT: 0.55, volleyN: 3, volleySpd: 330, enrageAt: 0.5, contact: 1 }, // ボス: HP（＋銃改造の合計Lv×hpPerMod 倍＝ビルドが強いほど長く戦う）／半径／歩く速さ／予兆(秒)／技の間(秒)／放射弾の数・速さ／突進の速さ・時間／三連射の数・速さ／怒りに入るHP割合
  loot:    { scrapDrop: 0.35, scrapReward: 4, scrapPerFloor: 2, heal: 2, pricePart: 7, priceHeal: 4, priceStep: 2, bossScrap: 12 }, // 撃破時のスクラップ落下率／部屋報酬のスクラップ（＋フロア×2）／回復量／商人の値段（＋フロア×step）
  parts:   { maxLv: 3, nanoNeed: 4 },                                                             // 部品の最大レベル／修復ナノ＝部屋クリア (nanoNeed−Lv) 回ごとに HP+1
};
const COL = {
  bg: '#0b0f1a', floor: '#121c33', grid: '#1a2742', wall: '#24335a', wallEdge: '#4a6ab0',
  doorClosed: '#ff2d7a', doorOpen: '#00e5ff', player: '#00e5ff', rusher: '#ff2d7a', shooter: '#ffb347', boss: '#ff2d7a',
  ebullet: '#ffd166', pbullet: '#eaffff', text: '#cfe3ff', mut: '#7f93b8', hp: '#ff4d6d', portal: '#b388ff', white: '#ffffff',
  implant: '#6cff8a', mod: '#ffb347', scrap: '#ffd166', heal: '#ff4d6d', shop: '#ffd166', treasure: '#b388ff', exit: '#b388ff'
};
// 報酬・部屋の種類の見せ方（扉の看板・ミニマップ・拾い物で共通）
const RK = {
  implant:  { c: COL.implant,  ch: '義', label: '義体' },
  mod:      { c: COL.mod,      ch: '改', label: '銃改造' },
  scrap:    { c: COL.scrap,    ch: '材', label: 'スクラップ' },
  heal:     { c: COL.heal,     ch: '回', label: '回復' },
  shop:     { c: COL.shop,     ch: '商', label: '商人' },

};
// 部品（ラン内成長）＝義体（implant）と銃改造（mod）。どちらも「射撃と回避の挙動を変える」1つの系に束ねる（要件定義 #5）
const PARTS = [
  { id: 'legs',   fam: 'implant', short: '脚', name: '脚部アクチュエータ', desc: '移動速度 +12%' },
  { id: 'reflex', fam: 'implant', short: '反', name: '反射神経ブースト',   desc: 'ダッシュの再使用が 30% 早くなる' },
  { id: 'armor',  fam: 'implant', short: '装', name: '装甲皮膚',           desc: '最大HP +1（HP も 1 回復）' },
  { id: 'skin',   fam: 'implant', short: '硬', name: '硬化外皮',           desc: '被弾後の無敵時間 +40%' },
  { id: 'nano',   fam: 'implant', short: '修', name: '修復ナノマシン',     desc: '部屋を 3 つクリアするごとに HP +1（Lvで短縮）' },
  { id: 'rate',   fam: 'mod',     short: '連', name: '高速機関部',         desc: '連射 +25%' },
  { id: 'dmg',    fam: 'mod',     short: '威', name: '大口径弾',           desc: '弾の威力 +1' },
  { id: 'pierce', fam: 'mod',     short: '貫', name: '徹甲弾',             desc: '弾が敵を 1 体 貫通する' },
  { id: 'multi',  fam: 'mod',     short: '多', name: '多銃身',             desc: '同時に撃つ弾 +1（扇状に広がる）' },
  { id: 'range',  fam: 'mod',     short: '射', name: '長銃身',             desc: '射程 +25%・弾速 +15%' },
];
const PART = {}; for (const p of PARTS) PART[p.id] = p;
// 部屋テンプレ（内側10×16の座標・[c, r, w, h] の壁ブロック）。ドアの進入路（内側 cols4-5 の上下2行・rows7-8 の左右2列）は空けてある
const TPL = [
  [],                                                                 // 0 空（開始・商人・宝物庫・ボス部屋）
  [[2, 3, 2, 2], [6, 3, 2, 2], [2, 11, 2, 2], [6, 11, 2, 2]],         // 1 四柱
  [[3, 7, 4, 2]],                                                     // 2 中央ブロック（横一直線の射線を切る）
  [[2, 5, 6, 1], [2, 10, 6, 1]],                                      // 3 二本の横棒
  [[1, 3, 1, 1], [8, 3, 1, 1], [4, 6, 1, 1], [5, 9, 1, 1], [1, 12, 1, 1], [8, 12, 1, 1]], // 4 散在
  [[0, 5, 3, 1], [7, 5, 3, 1], [0, 10, 3, 1], [7, 10, 3, 1]],         // 5 壁から伸びる棚
  [[1, 2, 2, 1], [7, 2, 2, 1], [4, 7, 2, 2], [1, 13, 2, 1], [7, 13, 2, 1]], // 6 中央柱＋四隅の短い棚
  [[0, 3, 4, 1], [6, 12, 4, 1], [3, 8, 1, 1], [6, 6, 1, 1]],          // 7 斜めに切る棚と小石
];

// ---------- 乱数（シード付き）----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function floorRng(seed, fi) { return mulberry32((seed + Math.imul(fi + 1, 0x9E3779B9)) >>> 0); }   // フロアごとに独立した列＝中断セーブの再生成で同じ地図になる

// ---------- 保存（設定＋通算／ラン中）----------
const SAVE_KEY = 'printrun.p1', RUN_KEY = 'printrun.run';
let S = { sound: true, meter: true, dashInput: 'flick', runs: 0, kills: 0, clears: 0, bestRooms: 0, wins: 0, bestFloor: 0, scrapBank: 0 };   // dashInput: 'tap' | 'flick' | 'both'（既定はフリック＝2026-09-11 マスター選択）／scrapBank＝拠点（Phase 3）で使う貯蔵スクラップ
try { const j = localStorage.getItem(SAVE_KEY); if (j) S = Object.assign(S, JSON.parse(j)); } catch (e) { }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { } }
function loadRun() { try { const j = localStorage.getItem(RUN_KEY); if (!j) return null; const o = JSON.parse(j); return (o && o.v === 2) ? o : null; } catch (e) { return null; } }
function clearRun() { try { localStorage.removeItem(RUN_KEY); } catch (e) { } G.saved = null; }

// ---------- 音（Web Audio・合成のみ）----------
const AU = { ctx: null, gain: null };
function au() {
  if (!AU.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; AU.ctx = new AC(); AU.gain = AU.ctx.createGain(); AU.gain.gain.value = S.sound ? 0.5 : 0; AU.gain.connect(AU.ctx.destination); }
  if (AU.ctx.state !== 'running') AU.ctx.resume();
  return AU.ctx;
}
function setSound(on) { S.sound = on; save(); if (AU.gain) AU.gain.gain.value = on ? 0.5 : 0; }
function tone(f0, f1, dur, type, vol, delay) {
  const c = au(); if (!c || !S.sound) return; const t0 = c.currentTime + (delay || 0);
  const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur); o.connect(g); g.connect(AU.gain); o.start(t0); o.stop(t0 + dur + 0.02);
}
let noiseBuf = null;
function noise(dur, vol, delay) {
  const c = au(); if (!c || !S.sound) return;
  if (!noiseBuf) { noiseBuf = c.createBuffer(1, c.sampleRate * 0.5, c.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t0 = c.currentTime + (delay || 0); const s = c.createBufferSource(); s.buffer = noiseBuf; const g = c.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur); s.connect(g); g.connect(AU.gain); s.start(t0); s.stop(t0 + dur + 0.02);
}
const SFX = {
  shot() { tone(900, 300, 0.06, 'square', 0.12); noise(0.03, 0.08); },
  hit() { tone(420, 200, 0.05, 'triangle', 0.12); },
  kill() { noise(0.15, 0.22); tone(240, 60, 0.22, 'sawtooth', 0.18); },
  hurt() { tone(170, 70, 0.28, 'sawtooth', 0.3); noise(0.1, 0.15); },
  tell() { tone(1400, 1400, 0.05, 'square', 0.07); },
  dash() { noise(0.09, 0.15); tone(300, 700, 0.09, 'sine', 0.08); },
  pdash() { noise(0.06, 0.12); tone(520, 1200, 0.09, 'sine', 0.11); },
  eshot() { tone(640, 320, 0.08, 'sawtooth', 0.1); },
  door() { tone(520, 780, 0.14, 'sine', 0.18); tone(780, 1040, 0.16, 'sine', 0.16, 0.12); },
  spawn() { tone(200, 420, 0.12, 'sine', 0.08); },
  portal() { tone(440, 880, 0.3, 'triangle', 0.12); },
  clear() { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.18, 'triangle', 0.16, i * 0.11)); },
  dead() { tone(320, 55, 0.7, 'sawtooth', 0.28); noise(0.3, 0.12, 0.1); },
  start() { tone(440, 660, 0.12, 'square', 0.1); tone(660, 990, 0.14, 'square', 0.1, 0.1); },
  pick() { tone(660, 1320, 0.12, 'triangle', 0.14); tone(990, 1980, 0.14, 'triangle', 0.1, 0.08); },
  scrap() { tone(1200, 1800, 0.05, 'square', 0.06); },
  buy() { tone(880, 1760, 0.1, 'sine', 0.12); tone(1320, 2640, 0.12, 'sine', 0.1, 0.07); },
  deny() { tone(220, 160, 0.12, 'square', 0.1); },
  heal() { tone(520, 1040, 0.2, 'sine', 0.14); },
  bossTell() { tone(110, 90, 0.35, 'sawtooth', 0.16); },
  bossRing() { noise(0.2, 0.2); tone(300, 120, 0.3, 'square', 0.14); },
  bossDead() { [200, 160, 120, 80].forEach((f, i) => tone(f, f * 0.5, 0.4, 'sawtooth', 0.22, i * 0.18)); noise(0.8, 0.2, 0.2); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, f, 0.24, 'triangle', 0.16, i * 0.13)); },
};

// ---------- 画面レイアウト ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const stat = document.createElement('canvas');                    // 部屋の静的レイヤー（床＋壁）＝部屋に入った時だけ描く
const L = { w: 0, h: 0, dpr: 1, sat: 0, sab: 0, satRaw: 0, sabRaw: 0, s: 1, ox: 0, oy: 0, topH: 0, botH: 0 };
function isStandalone() { return !!navigator.standalone || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches; }
function readSafe() {
  // p0 計測ページと同じ読み方（:root の --sat/--sab）を第一に、probe の padding を第二に（2026-09-11: p1 は probe だけで、iPhone のホーム画面版で 0 と読めて HUD がステータスバーに被った）
  const rs = getComputedStyle(document.documentElement);
  let sat = parseFloat(rs.getPropertyValue('--sat')) || 0, sab = parseFloat(rs.getPropertyValue('--sab')) || 0;
  if (!sat && !sab) { const cs = getComputedStyle(document.getElementById('probe')); sat = parseFloat(cs.paddingTop) || 0; sab = parseFloat(cs.paddingBottom) || 0; }
  L.satRaw = sat; L.sabRaw = sab;
  if (isStandalone()) { if (sat < 20) sat = TUNE.ui.fallbackSat; if (sab < 10) sab = TUNE.ui.fallbackSab; }   // 保険＝読めなくても被らない
  L.sat = sat; L.sab = sab;
}
function layout() {
  readSafe(); L.w = innerWidth; L.h = innerHeight; L.dpr = Math.min(3, devicePixelRatio || 1);
  cv.width = Math.round(L.w * L.dpr); cv.height = Math.round(L.h * L.dpr); ctx.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
  L.topH = L.sat + 64; L.botH = L.sab + 84;   // 下帯は部品の列（Phase 2）を足して 70→84
  const ph = Math.max(200, L.h - L.topH - L.botH);
  L.s = Math.min(L.w / RW, ph / RH); L.ox = (L.w - RW * L.s) / 2; L.oy = L.topH + (ph - RH * L.s) / 2;
  renderStatic();
}
addEventListener('resize', layout); addEventListener('orientationchange', () => setTimeout(layout, 50));
if (window.visualViewport) visualViewport.addEventListener('resize', layout);
addEventListener('load', layout); setTimeout(layout, 300); setTimeout(layout, 1000);   // env() が起動直後に確定しない環境の保険
function relayoutIfChanged() {   // 30フレームごと＝窓の大きさか safe-area が変わっていたら組み直す
  if (innerWidth !== L.w || innerHeight !== L.h) { layout(); return; }
  const a = L.sat, b = L.sab; readSafe(); if (a !== L.sat || b !== L.sab) layout();
}

// ---------- ゲーム状態 ----------
const G = { mode: 'title', seed: 0, floorIdx: 0, floor: null, room: null, tiles: null, open: true, flow: new Int16Array(COLS * ROWS), flowT: 0,
  kills: 0, time: 0, banner: null, shake: 0, portal: null, aim: null, overlayT: 0, roomsVisited: 0, deadT: 0,
  parts: {}, scrap: 0, nanoCnt: 0, pickups: [], peds: [], floats: [], choice: null, saved: null, boss: null, runScrapStart: 0 };
const player = { x: RW / 2, y: RH / 2, r: 11, hp: TUNE.player.hp, maxHp: TUNE.player.hp, inv: 0, ang: -Math.PI / 2, fireT: 0, alive: true, spd: TUNE.player.spd, moving: false, flash: 0, dashT: 0, dashCool: 0, ddx: 0, ddy: 0 };
const D = { spd: 0, fireRate: 0, dmg: 1, pierce: 0, multi: 0, range: 0, bulletSpd: 0, dashCool: 0, inv: 0 };   // 部品を反映した現在値（recompute で作る）
let enemies = [], bullets = [], parts = [];
function lv(id) { return G.parts[id] || 0; }
function recompute() {
  D.spd = TUNE.player.spd * (1 + 0.12 * lv('legs')); player.spd = D.spd;
  D.fireRate = TUNE.player.fireRate / (1 + 0.25 * lv('rate'));
  D.dmg = 1 + lv('dmg'); D.pierce = lv('pierce'); D.multi = lv('multi');
  D.range = TUNE.player.range * (1 + 0.25 * lv('range')); D.bulletSpd = TUNE.player.bulletSpd * (1 + 0.15 * lv('range'));
  D.dashCool = Math.max(0.12, TUNE.dash.cool * (1 - 0.3 * lv('reflex')));
  D.inv = TUNE.player.inv * (1 + 0.4 * lv('skin'));
}
recompute();
function floorCfg() { return TUNE.floors[G.floorIdx] || TUNE.floors[TUNE.floors.length - 1]; }
function isBossFloor() { return !!floorCfg().boss; }
function isCombat(room) { return room.type === 'normal' || room.type === 'exit' || room.type === 'boss'; }

// ---------- 生成器（部屋グリッド型）----------
function key(x, y) { return x + ',' + y; }
function genFloor(fi) {
  const rng = floorRng(G.seed, fi), cfg = TUNE.floors[fi] || TUNE.floors[TUNE.floors.length - 1];
  const rooms = new Map(), list = [];
  const add = (gx, gy, type) => { const r = { gx, gy, type, doors: {}, tpl: 0, fx: false, fy: false, cleared: false, visited: false, spawned: false, dist: -1, reward: null, rewardTaken: false, items: null }; rooms.set(key(gx, gy), r); list.push(r); return r; };
  const pick = (arr) => arr[Math.floor(rng() * arr.length)];
  if (cfg.boss) {   // ボスフロア＝開始部屋の北にボス部屋
    const start = add(2, 4, 'start'); const boss = add(2, 3, 'boss'); start.doors.N = true; boss.doors.S = true; start.dist = 0; boss.dist = 1;
    return { rooms, list, start, exit: boss, n: 2, idx: fi, boss: true, shop: null, treasure: null };
  }
  const n = cfg.rooms[0] + Math.floor(rng() * (cfg.rooms[1] - cfg.rooms[0] + 1));
  const start = add(Math.floor(rng() * GRID), Math.floor(rng() * GRID), 'start');

// ---------- 計器（1フレームのJS処理時間）----------
const M = { js: [], dts: [], avg: 0, max: 0, fps: 0 };
