<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PRINT RUN">
<meta name="theme-color" content="#0b0f1a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>PRINT RUN ―弾丸輪廻―</title>
<style>
  :root { --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px); }
  html, body { margin:0; padding:0; height:100%; background:#0b0f1a; overflow:hidden; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:none;
    font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  canvas { display:block; position:fixed; inset:0; width:100%; height:100%; touch-action:none; }
  #probe { position:absolute; left:-9999px; top:0; width:0; height:0; visibility:hidden; padding:var(--sat) var(--sar) var(--sab) var(--sal); }
</style>
</head>
<body>
<div id="probe"></div>
<canvas id="c"></canvas>
<script>
'use strict';
/* =====================================================================
   PRINT RUN ―弾丸輪廻―  Phase 1 縦切り（p1）
   主人公1・銃1・敵2種・最小の生成器（部屋グリッド型）・死亡→再開
   操作: 画面のどこでも触れた所が仮想スティックの中心。動く＝避ける／止まる＝撃つ（自動照準）
   ===================================================================== */
const VERSION = 'p1-0.1.0';

// ---------- 定数 ----------
const TILE = 32, COLS = 12, ROWS = 18, RW = COLS * TILE, RH = ROWS * TILE;   // 部屋＝12×18タイル（外周は壁）
const GRID = 4;                                                                 // 部屋グリッド 4×4
const DIRS = { N: { dx: 0, dy: -1 }, S: { dx: 0, dy: 1 }, W: { dx: -1, dy: 0 }, E: { dx: 1, dy: 0 } };
const OPP = { N: 'S', S: 'N', W: 'E', E: 'W' };
// 手触りの調整値（Phase 1 で遊びながら動かす場所はここに集約）
const TUNE = {
  player:  { hp: 5, spd: 175, fireRate: 0.2, bulletSpd: 480, range: 280, inv: 0.9 },          // 速さ／連射間隔(秒)／弾速／射程／被弾後の無敵(秒)
  rusher:  { hp: 4, spd: 95, tellDist: 200, tellT: 0.45, dashSpd: 520, dashT: 0.4, restT: 0.75 }, // 突進型: 予兆に入る距離／予兆(秒)／突進速度・時間／硬直
  shooter: { hp: 2, spd: 70, near: 130, far: 300, aimT: 0.55, lockT: 0.18, bulletSpd: 230, coolT: 1.1 }, // 射撃型: 近すぎ→下がる／狙い(秒)／照準ロック(残り秒)／弾速／再装填
  room:    { base: 3, rand: 3, bonusFrom: 3, max: 6, spawnDist: 170 },                          // 1部屋の敵＝base+0..rand-1（3部屋目以降+1・上限max）／主人公からの最短出現距離
};
const COL = {
  bg: '#0b0f1a', floor: '#121c33', grid: '#1a2742', wall: '#24335a', wallEdge: '#4a6ab0',
  doorClosed: '#ff2d7a', doorOpen: '#00e5ff', player: '#00e5ff', rusher: '#ff2d7a', shooter: '#ffb347',
  ebullet: '#ffd166', pbullet: '#eaffff', text: '#cfe3ff', mut: '#7f93b8', hp: '#ff4d6d', portal: '#b388ff', white: '#ffffff'
};
// 部屋テンプレ（内側10×16の座標・[c, r, w, h] の壁ブロック）。ドアの進入路（内側 cols4-5 の上下2行・rows7-8 の左右2列）は空けてある
const TPL = [
  [],                                                                 // 0 空（開始・出口部屋）
  [[2, 3, 2, 2], [6, 3, 2, 2], [2, 11, 2, 2], [6, 11, 2, 2]],         // 1 四柱
  [[3, 7, 4, 2]],                                                     // 2 中央ブロック（横一直線の射線を切る）
  [[2, 5, 6, 1], [2, 10, 6, 1]],                                      // 3 二本の横棒
  [[1, 3, 1, 1], [8, 3, 1, 1], [4, 6, 1, 1], [5, 9, 1, 1], [1, 12, 1, 1], [8, 12, 1, 1]], // 4 散在
  [[0, 5, 3, 1], [7, 5, 3, 1], [0, 10, 3, 1], [7, 10, 3, 1]],         // 5 壁から伸びる棚
];

// ---------- 乱数（シード付き）----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- 保存（設定＋通算）----------
const SAVE_KEY = 'printrun.p1';
let S = { sound: true, meter: true, runs: 0, kills: 0, clears: 0, bestRooms: 0 };
try { const j = localStorage.getItem(SAVE_KEY); if (j) S = Object.assign(S, JSON.parse(j)); } catch (e) { }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { } }

// ---------- 音（Web Audio・合成のみ）----------
const AU = { ctx: null, gain: null };
function au() {
  if (!AU.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; AU.ctx = new AC(); AU.gain = AU.ctx.createGain(); AU.gain.gain.value = S.sound ? 0.5 : 0; AU.gain.connect(AU.ctx.destination); }
  if (AU.ctx.state !== 'running') AU.ctx.resume();
  return AU.ctx;
}
function setSound(on) { S.sound = on; save(); if (AU.gain) AU.gain.gain.value = on ? 0.5 : 0; }
function tone(f0, f1, dur, type, vol, delay) {
  const c = au(); if (!c || !S.sound) return; const t0 = c.currentTime + (delay || 0);
  const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur); o.connect(g); g.connect(AU.gain); o.start(t0); o.stop(t0 + dur + 0.02);
}
let noiseBuf = null;
function noise(dur, vol, delay) {
  const c = au(); if (!c || !S.sound) return;
  if (!noiseBuf) { noiseBuf = c.createBuffer(1, c.sampleRate * 0.5, c.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t0 = c.currentTime + (delay || 0); const s = c.createBufferSource(); s.buffer = noiseBuf; const g = c.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur); s.connect(g); g.connect(AU.gain); s.start(t0); s.stop(t0 + dur + 0.02);
}
const SFX = {
  shot() { tone(900, 300, 0.06, 'square', 0.12); noise(0.03, 0.08); },
  hit() { tone(420, 200, 0.05, 'triangle', 0.12); },
  kill() { noise(0.15, 0.22); tone(240, 60, 0.22, 'sawtooth', 0.18); },
  hurt() { tone(170, 70, 0.28, 'sawtooth', 0.3); noise(0.1, 0.15); },
  tell() { tone(1400, 1400, 0.05, 'square', 0.07); },
  dash() { noise(0.09, 0.15); tone(300, 700, 0.09, 'sine', 0.08); },
  eshot() { tone(640, 320, 0.08, 'sawtooth', 0.1); },
  door() { tone(520, 780, 0.14, 'sine', 0.18); tone(780, 1040, 0.16, 'sine', 0.16, 0.12); },
  spawn() { tone(200, 420, 0.12, 'sine', 0.08); },
  portal() { tone(440, 880, 0.3, 'triangle', 0.12); },
  clear() { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.18, 'triangle', 0.16, i * 0.11)); },
  dead() { tone(320, 55, 0.7, 'sawtooth', 0.28); noise(0.3, 0.12, 0.1); },
  start() { tone(440, 660, 0.12, 'square', 0.1); tone(660, 990, 0.14, 'square', 0.1, 0.1); },
};

// ---------- 画面レイアウト ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const stat = document.createElement('canvas');                    // 部屋の静的レイヤー（床＋壁）＝部屋に入った時だけ描く
const L = { w: 0, h: 0, dpr: 1, sat: 0, sab: 0, s: 1, ox: 0, oy: 0, topH: 0, botH: 0 };
function readSafe() { const cs = getComputedStyle(document.getElementById('probe')); L.sat = parseFloat(cs.paddingTop) || 0; L.sab = parseFloat(cs.paddingBottom) || 0; }
function layout() {
  readSafe(); L.w = innerWidth; L.h = innerHeight; L.dpr = Math.min(3, devicePixelRatio || 1);
  cv.width = Math.round(L.w * L.dpr); cv.height = Math.round(L.h * L.dpr); ctx.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
  L.topH = L.sat + 64; L.botH = L.sab + 70;
  const ph = Math.max(200, L.h - L.topH - L.botH);
  L.s = Math.min(L.w / RW, ph / RH); L.ox = (L.w - RW * L.s) / 2; L.oy = L.topH + (ph - RH * L.s) / 2;
  renderStatic();
}
addEventListener('resize', layout); addEventListener('orientationchange', () => setTimeout(layout, 50));
if (window.visualViewport) visualViewport.addEventListener('resize', layout);

// ---------- ゲーム状態 ----------
const G = { mode: 'title', seed: 0, rng: Math.random, floor: null, room: null, tiles: null, open: true, flow: new Int16Array(COLS * ROWS), flowT: 0,
  kills: 0, time: 0, banner: null, shake: 0, portal: null, aim: null, overlayT: 0, roomsVisited: 0, deadT: 0 };
const player = { x: RW / 2, y: RH / 2, r: 11, hp: TUNE.player.hp, maxHp: TUNE.player.hp, inv: 0, ang: -Math.PI / 2, fireT: 0, alive: true, spd: TUNE.player.spd, moving: false, flash: 0 };
let enemies = [], bullets = [], parts = [];

// ---------- 生成器（部屋グリッド型）----------
function key(x, y) { return x + ',' + y; }
function genFloor(rng) {
  const n = 3 + Math.floor(rng() * 3);                              // 部屋3〜5
  const rooms = new Map(), list = [];
  const add = (gx, gy, type) => { const r = { gx, gy, type, doors: {}, tpl: 0, fx: false, fy: false, cleared: false, visited: false, spawned: false, dist: -1 }; rooms.set(key(gx, gy), r); list.push(r); return r; };
  const start = add(Math.floor(rng() * GRID), Math.floor(rng() * GRID), 'start');
  let guard = 0;
  while (list.length < n && guard++ < 500) {
    const base = list[Math.floor(rng() * list.length)]; const ks = Object.keys(DIRS); const d = DIRS[ks[Math.floor(rng() * 4)]];
    const nx = base.gx + d.dx, ny = base.gy + d.dy; if (nx < 0 || ny < 0 || nx >= GRID || ny >= GRID || rooms.has(key(nx, ny))) continue;
    add(nx, ny, 'normal');
  }
  for (const r of list) for (const k in DIRS) { const d = DIRS[k]; if (rooms.has(key(r.gx + d.dx, r.gy + d.dy))) r.doors[k] = true; }
  // 開始から最も遠い部屋＝出口
  start.dist = 0; const q = [start];
  while (q.length) { const r = q.shift(); for (const k in r.doors) { const d = DIRS[k]; const nb = rooms.get(key(r.gx + d.dx, r.gy + d.dy)); if (nb.dist < 0) { nb.dist = r.dist + 1; q.push(nb); } } }
  let far = list.filter(r => r !== start); const md = Math.max.apply(null, far.map(r => r.dist)); far = far.filter(r => r.dist === md);
  const exit = far[Math.floor(rng() * far.length)]; exit.type = 'exit';
  for (const r of list) { if (r.type === 'normal') { r.tpl = 1 + Math.floor(rng() * (TPL.length - 1)); r.fx = rng() < 0.5; r.fy = rng() < 0.5; } }
  return { rooms, list, start, exit, n: list.length };
}
function neighbor(room, dir) { const d = DIRS[dir]; return G.floor.rooms.get(key(room.gx + d.dx, room.gy + d.dy)); }
function buildTiles(room) {
  const t = new Uint8Array(COLS * ROWS);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1) t[c + r * COLS] = 1;
  for (const b of TPL[room.tpl]) {
    let [c, r, w, h] = b; if (room.fx) c = 10 - c - w; if (room.fy) r = 16 - r - h;
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) t[(c + 1 + i) + (r + 1 + j) * COLS] = 1;
  }
  if (room.doors.N) { t[5] = 2; t[6] = 2; }
  if (room.doors.S) { t[5 + (ROWS - 1) * COLS] = 2; t[6 + (ROWS - 1) * COLS] = 2; }
  if (room.doors.W) { t[8 * COLS] = 2; t[9 * COLS] = 2; }
  if (room.doors.E) { t[(COLS - 1) + 8 * COLS] = 2; t[(COLS - 1) + 9 * COLS] = 2; }
  return t;
}
function tileAt(c, r) { if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return 1; return G.tiles[c + r * COLS]; }
function solidTile(c, r) { const t = tileAt(c, r); return t === 1 || (t === 2 && !G.open); }
function solidAt(x, y) { return solidTile(Math.floor(x / TILE), Math.floor(y / TILE)); }
function los(x0, y0, x1, y1) { const d = Math.hypot(x1 - x0, y1 - y0); const n = Math.max(1, Math.ceil(d / (TILE / 3))); for (let i = 1; i < n; i++) { if (solidAt(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n)) return false; } return true; }

// ---------- 当たり（円 vs タイル）----------
function resolveAxis(e, horiz) {
  const c0 = Math.max(0, Math.floor((e.x - e.r) / TILE)), c1 = Math.min(COLS - 1, Math.floor((e.x + e.r) / TILE));
  const r0 = Math.max(0, Math.floor((e.y - e.r) / TILE)), r1 = Math.min(ROWS - 1, Math.floor((e.y + e.r) / TILE));
  let hit = false;
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    if (!solidTile(c, r)) continue;
    const tx0 = c * TILE, ty0 = r * TILE, tx1 = tx0 + TILE, ty1 = ty0 + TILE;
    const cx = Math.max(tx0, Math.min(e.x, tx1)), cy = Math.max(ty0, Math.min(e.y, ty1));
    const dx = e.x - cx, dy = e.y - cy;
    if (dx * dx + dy * dy >= e.r * e.r - 1e-6) continue;
    hit = true;
    const inX = e.x > tx0 && e.x < tx1, inY = e.y > ty0 && e.y < ty1;
    if (inX && inY) { if (horiz) e.x = (e.x < tx0 + TILE / 2) ? tx0 - e.r : tx1 + e.r; else e.y = (e.y < ty0 + TILE / 2) ? ty0 - e.r : ty1 + e.r; }  // 中心がタイル内＝移動軸で押し出す
    else if (inX) { e.y = dy < 0 ? ty0 - e.r : ty1 + e.r; }                                   // 上下の辺に接触
    else if (inY) { e.x = dx < 0 ? tx0 - e.r : tx1 + e.r; }                                   // 左右の辺に接触
    else { const d = Math.sqrt(dx * dx + dy * dy) || 0.0001; const push = e.r - d; e.x += dx / d * push; e.y += dy / d * push; }  // 角＝角から離す（滑って抜ける）
  }
  return hit;
}
function moveCircle(e, dx, dy) { let hit = false; e.x += dx; if (resolveAxis(e, true)) hit = true; e.y += dy; if (resolveAxis(e, false)) hit = true; e.x = Math.max(e.r, Math.min(RW - e.r, e.x)); e.y = Math.max(e.r, Math.min(RH - e.r, e.y)); return hit; }

// ---------- 流れ場（敵の経路）----------
function computeFlow() {
  const F = G.flow; F.fill(-1); const pc = Math.max(0, Math.min(COLS - 1, Math.floor(player.x / TILE))), pr = Math.max(0, Math.min(ROWS - 1, Math.floor(player.y / TILE)));
  const q = [pc + pr * COLS]; F[q[0]] = 0; let h = 0;
  while (h < q.length) { const i = q[h++]; const c = i % COLS, r = (i / COLS) | 0; const nb = [[c + 1, r], [c - 1, r], [c, r + 1], [c, r - 1]];
    for (const [nc, nr] of nb) { if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS || solidTile(nc, nr)) continue; const j = nc + nr * COLS; if (F[j] < 0) { F[j] = F[i] + 1; q.push(j); } } }
}
function flowDir(e) {
  const F = G.flow; const c = Math.max(0, Math.min(COLS - 1, Math.floor(e.x / TILE))), r = Math.max(0, Math.min(ROWS - 1, Math.floor(e.y / TILE)));
  let bd = F[c + r * COLS]; if (bd < 0) return null; let best = null;
  const cand = [[c + 1, r], [c - 1, r], [c, r + 1], [c, r - 1]];
  const ok = (a, b) => a >= 0 && b >= 0 && a < COLS && b < ROWS && !solidTile(a, b);
  for (const [dc, dr] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) if (ok(c + dc, r) && ok(c, r + dr) && ok(c + dc, r + dr)) cand.push([c + dc, r + dr]);
  for (const [nc, nr] of cand) { if (!ok(nc, nr)) continue; const v = F[nc + nr * COLS]; if (v >= 0 && v < bd) { bd = v; best = [nc, nr]; } }
  if (!best) return null;
  const tx = best[0] * TILE + TILE / 2, ty = best[1] * TILE + TILE / 2; const d = Math.hypot(tx - e.x, ty - e.y) || 1; return { x: (tx - e.x) / d, y: (ty - e.y) / d };
}

// ---------- 演出 ----------
function burst(x, y, col, n, spd, life, size) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = spd * (0.4 + Math.random() * 0.8); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life, max: life, col, size: size || 3 }); } }
function banner(text, t) { G.banner = { text, t: t || 1.2, max: t || 1.2 }; }

// ---------- ラン・部屋 ----------
function newRun() {
  G.seed = ((Date.now() ^ (Math.random() * 0xffffffff)) >>> 0); G.rng = mulberry32(G.seed); G.floor = genFloor(G.rng);
  G.kills = 0; G.time = 0; G.shake = 0; G.portal = null; G.aim = null; G.overlayT = 0; G.roomsVisited = 0; parts = [];
  Object.assign(player, { x: RW / 2, y: RH / 2, hp: player.maxHp, inv: 0, ang: -Math.PI / 2, fireT: 0, alive: true, moving: false, flash: 0 });
  G.mode = 'run'; enterRoom(G.floor.start, null); SFX.start();
}
function enterRoom(room, fromDir) {
  G.room = room; G.tiles = buildTiles(room); enemies = []; bullets = []; G.portal = null; G.aim = null;
  if (!room.visited) { room.visited = true; G.roomsVisited++; }
  if (fromDir === 'N') { player.x = RW / 2; player.y = TILE * 1.7; } else if (fromDir === 'S') { player.x = RW / 2; player.y = RH - TILE * 1.7; }
  else if (fromDir === 'W') { player.x = TILE * 1.7; player.y = RH / 2; } else if (fromDir === 'E') { player.x = RW - TILE * 1.7; player.y = RH / 2; } else { player.x = RW / 2; player.y = RH / 2; }
  if (!room.cleared && room.type !== 'start') { G.open = false; room.spawned = true; spawnEnemies(room); }
  else { G.open = true; room.cleared = true; if (room.type === 'exit') { G.portal = { x: RW / 2, y: RH / 2, t: 0 }; } }
  computeFlow(); G.flowT = 0; renderStatic();
  banner(room.type === 'start' ? 'START' : room.type === 'exit' ? 'EXIT ROOM' : 'ROOM ' + G.roomsVisited, 1.0);
}
function spawnEnemies(room) {
  const order = G.roomsVisited; const n = Math.min(TUNE.room.max, TUNE.room.base + Math.floor(G.rng() * TUNE.room.rand) + (order >= TUNE.room.bonusFrom ? 1 : 0));
  const cells = [];
  for (let r = 1; r < ROWS - 1; r++) for (let c = 1; c < COLS - 1; c++) { if (G.tiles[c + r * COLS] !== 0) continue; const x = c * TILE + TILE / 2, y = r * TILE + TILE / 2; if (Math.hypot(x - player.x, y - player.y) < TUNE.room.spawnDist) continue; cells.push([x, y]); }
  for (let i = cells.length - 1; i > 0; i--) { const j = Math.floor(G.rng() * (i + 1)); const t = cells[i]; cells[i] = cells[j]; cells[j] = t; }
  for (let i = 0; i < n && i < cells.length; i++) {
    const type = (i === 0) ? 'rusher' : (i === 1) ? 'shooter' : (G.rng() < 0.6 ? 'rusher' : 'shooter');
    const [x, y] = cells[i];
    enemies.push(type === 'rusher'
      ? { type, x, y, r: 13, hp: TUNE.rusher.hp, maxHp: TUNE.rusher.hp, st: 'spawn', t: 0.8 + i * 0.12, dx: 0, dy: 0, flash: 0, face: 0, sx: x, sy: y, stuckT: 0, nudgeT: 0, nudge: 0 }
      : { type, x, y, r: 12, hp: TUNE.shooter.hp, maxHp: TUNE.shooter.hp, st: 'spawn', t: 0.8 + i * 0.12, ax: x, ay: y, flash: 0, face: 0, sx: x, sy: y, stuckT: 0, nudgeT: 0, nudge: 0 });
  }
  SFX.spawn();
}
function clearRoom() {
  G.room.cleared = true; G.open = true; SFX.door(); banner('CLEARED', 0.9);
  if (G.room.type === 'exit') { G.portal = { x: RW / 2, y: RH / 2, t: 0 }; SFX.portal(); }

  layoutButtons();
  // 上帯
  ctx.fillStyle = 'rgba(11,15,26,0.85)'; ctx.fillRect(0, 0, L.w, L.topH);
  for (let i = 0; i < player.maxHp; i++) { const x = 14 + i * 20, y = L.sat + 16; ctx.fillStyle = i < player.hp ? COL.hp : '#2a3350'; dia(x + 7, y + 7, 7); ctx.fill(); }
  ctx.fillStyle = COL.text; ctx.font = '600 12px -apple-system, "Hiragino Sans", sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  if (G.floor) ctx.fillText('ROOM ' + G.roomsVisited + '/' + G.floor.n + '   KILL ' + G.kills + '   ' + fmt(G.time), 14, L.sat + 52);
  for (const [b, label] of [[BTN.sound, S.sound ? '♪' : '✕'], [BTN.pause, G.mode === 'pause' ? '▶' : '❚❚']]) { ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(b.x, b.y, b.w, b.h); ctx.strokeStyle = '#2a3a60'; ctx.lineWidth = 1; ctx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1); ctx.fillStyle = COL.text; ctx.font = '600 15px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(label, b.x + b.w / 2, b.y + 25); }
  // 下帯
  ctx.fillStyle = 'rgba(11,15,26,0.85)'; ctx.fillRect(0, L.h - L.botH, L.w, L.botH);
  if (G.floor) { const cs = 11, gap = 3, size = GRID * cs + (GRID - 1) * gap, mx = L.w - 14 - size, my = L.h - L.sab - 10 - size;
    for (const r of G.floor.list) { const known = r.visited || Object.keys(r.doors).some(k => { const nb = neighbor(r, k); return nb && nb.visited; }); if (!known) continue;
      const x = mx + r.gx * (cs + gap), y = my + r.gy * (cs + gap);
      if (r === G.room) ctx.fillStyle = COL.player; else if (r.visited) ctx.fillStyle = (r.type === 'exit') ? COL.portal : '#3a5590'; else ctx.fillStyle = '#1a2340';
      ctx.fillRect(x, y, cs, cs); if (!r.visited) { ctx.strokeStyle = '#3a5590'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, cs - 1, cs - 1); }
      if (r.type === 'exit' && r.visited && r !== G.room) { ctx.fillStyle = '#0b0f1a'; ctx.fillRect(x + 4, y + 4, 3, 3); } }
    ctx.fillStyle = COL.mut; ctx.font = '500 9px sans-serif'; ctx.textAlign = 'right'; ctx.fillText('MAP', mx + size, my - 4); }
  ctx.textAlign = 'left'; ctx.fillStyle = COL.mut; ctx.font = '500 10px Menlo, monospace';
  if (S.meter) { ctx.fillText('js ' + M.avg.toFixed(1) + 'ms  max ' + M.max.toFixed(1) + 'ms  ' + M.fps + 'fps  e' + enemies.length + ' b' + bullets.length + ' p' + parts.length, 14, L.h - L.sab - 30); ctx.fillText('seed ' + G.seed.toString(16) + '  ' + (G.room ? 'tpl' + G.room.tpl : ''), 14, L.h - L.sab - 17); }
  ctx.fillText(VERSION, 14, L.h - L.sab - 5);
  // バナー
  if (G.banner) { const a = Math.min(1, G.banner.t / 0.3, (G.banner.max - G.banner.t) / 0.15 + 0.2); ctx.globalAlpha = Math.max(0, Math.min(1, a)); ctx.fillStyle = COL.text; ctx.font = '700 22px -apple-system, "Hiragino Sans", sans-serif'; ctx.textAlign = 'center'; ctx.fillText(G.banner.text, L.w / 2, L.topH + 40); ctx.globalAlpha = 1; }
}
function overlay(alpha) { ctx.fillStyle = 'rgba(5,8,16,' + alpha + ')'; ctx.fillRect(0, 0, L.w, L.h); }
function centerText(text, y, font, col, alpha) { ctx.globalAlpha = alpha == null ? 1 : alpha; ctx.fillStyle = col || COL.text; ctx.font = font; ctx.textAlign = 'center'; ctx.fillText(text, L.w / 2, y); ctx.globalAlpha = 1; }
function drawOverlays() {
  const cy = L.h / 2, blink = 0.55 + 0.45 * Math.sin(performance.now() / 300);
  if (G.mode === 'title') {
    overlay(0.55);
    centerText('PRINT RUN', cy - 70, '800 44px -apple-system, "Hiragino Sans", sans-serif', COL.player);
    centerText('―弾丸輪廻―', cy - 38, '600 16px -apple-system, "Hiragino Sans", sans-serif', COL.text);
    centerText('タップして開始', cy + 20, '600 16px -apple-system, "Hiragino Sans", sans-serif', COL.text, blink);
    centerText('指で動く ＝ 避ける　／　離す（止まる）＝ 撃つ', cy + 56, '500 13px -apple-system, "Hiragino Sans", sans-serif', COL.mut);
    centerText('部屋の敵を全滅させると扉が開く。EXIT の部屋を目指せ', cy + 78, '500 12px -apple-system, "Hiragino Sans", sans-serif', COL.mut);
    centerText('通算　刷 ' + S.runs + '　撃破 ' + S.kills + '　クリア ' + S.clears + '　最多到達 ' + S.bestRooms + '部屋', cy + 120, '500 12px -apple-system, "Hiragino Sans", sans-serif', COL.mut);
    centerText(VERSION + '  Phase 1 縦切り', cy + 142, '500 11px Menlo, monospace', COL.mut);
  } else if (G.mode === 'pause') {
    overlay(0.7); centerText('一時停止', cy - 120, '700 26px -apple-system, "Hiragino Sans", sans-serif');
    MENU.length = 0; const items = [['再開', () => { G.mode = 'run'; }], ['新しい刷（やり直す）', () => newRun()], ['音: ' + (S.sound ? 'ON' : 'OFF'), () => setSound(!S.sound)], ['計器: ' + (S.meter ? 'ON' : 'OFF'), () => { S.meter = !S.meter; save(); }]];
    items.forEach(([label, act], i) => { const w = Math.min(280, L.w - 60), h = 48, x = (L.w - w) / 2, y = cy - 70 + i * 58; MENU.push({ x, y, w, h, act }); ctx.fillStyle = 'rgba(255,255,255,0.07)'; ctx.fillRect(x, y, w, h); ctx.strokeStyle = '#2a3a60'; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1); centerText(label, y + 31, '600 16px -apple-system, "Hiragino Sans", sans-serif'); });
  } else if (G.mode === 'dead') {
    const a = Math.min(1, G.overlayT / 0.7); overlay(0.65 * a);
    if (G.overlayT > 0.4) { centerText('刷り直し', cy - 60, '800 40px -apple-system, "Hiragino Sans", sans-serif', COL.doorClosed, a); centerText('REPRINT', cy - 34, '600 12px Menlo, monospace', COL.mut, a);
      centerText('到達 ROOM ' + G.roomsVisited + '/' + G.floor.n + '　撃破 ' + G.kills + '　' + fmt(G.time), cy + 10, '500 14px -apple-system, "Hiragino Sans", sans-serif', COL.text, a);
      if (G.overlayT > 0.7) centerText('タップで次の刷', cy + 60, '600 16px -apple-system, "Hiragino Sans", sans-serif', COL.text, blink); }
  } else if (G.mode === 'clear') {
    const a = Math.min(1, G.overlayT / 0.7); overlay(0.6 * a);
    centerText('FLOOR CLEAR', cy - 60, '800 36px -apple-system, "Hiragino Sans", sans-serif', COL.portal, a);
    centerText('部屋 ' + G.roomsVisited + '/' + G.floor.n + '　撃破 ' + G.kills + '　' + fmt(G.time), cy - 10, '500 14px -apple-system, "Hiragino Sans", sans-serif', COL.text, a);
    centerText('次のフロアは Phase 2 で。', cy + 20, '500 12px -apple-system, "Hiragino Sans", sans-serif', COL.mut, a);
    if (G.overlayT > 0.7) centerText('タップで次の刷', cy + 60, '600 16px -apple-system, "Hiragino Sans", sans-serif', COL.text, blink);
  }
}
function draw() {
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, L.w, L.h);
  if (G.tiles) drawWorld();
  drawStick(); drawHUD(); drawOverlays();
}

// ---------- 計器（1フレームのJS処理時間）----------
const M = { js: [], dts: [], avg: 0, max: 0, fps: 0 };
function meter(js, dt) { M.js.push(js); M.dts.push(dt); if (M.js.length > 60) { M.js.shift(); M.dts.shift(); } if (M.js.length % 10 === 0) { let s = 0, mx = 0, sd = 0; for (let i = 0; i < M.js.length; i++) { s += M.js[i]; if (M.js[i] > mx) mx = M.js[i]; sd += M.dts[i]; } M.avg = s / M.js.length; M.max = mx; M.fps = sd > 0 ? Math.round(M.js.length / sd) : 0; } }

// ---------- メインループ ----------
let last = performance.now();
function frame(t) {
  requestAnimationFrame(frame); const t0 = performance.now(); let dt = (t - last) / 1000; last = t; if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
  if (G.mode === 'run') update(dt); else if (G.mode === 'dead' || G.mode === 'clear') updateFx(dt);
  draw(); meter(performance.now() - t0, dt);
}

// ---------- デバッグ用フック（PC確認用・ゲームには影響しない）----------
const PR = window.PR = { get G() { return G; }, player, get enemies() { return enemies; }, S, M, newRun, god: false, forced: null,
  setInput(x, y) { PR.forced = (x === null) ? null : { x, y }; }, killRoom() { enemies.length = 0; },
  step(n) { for (let i = 0; i < n; i++) { if (G.mode === 'run') update(1 / 60); else updateFx(1 / 60); } draw(); }, draw, TUNE, warp(dir) { const nb = neighbor(G.room, dir); if (nb) enterRoom(nb, OPP[dir]); return !!nb; }, press, layout };

// ---------- 起動 ----------
layout();
if (!G.tiles) { /* タイトル背景用に仮の部屋を1つ描いておく */ G.rng = mulberry32(12345); G.floor = genFloor(G.rng); G.room = G.floor.start; G.tiles = buildTiles(G.room); G.open = true; renderStatic(); G.floor = null; }
requestAnimationFrame(frame);
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) { navigator.serviceWorker.register('./sw.js').catch(() => { }); }
</script>
