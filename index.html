function flickVec() {

  const g = G.gun, n = g.n + D.multi, sp = g.spread * D.spread, fan = n > 1 ? Math.max(sp, 0.14 * (n - 1) * D.spread) : 0;   // 安定化アーム＝拡散（扇の幅・ばらつき）を縮める

  SFX.shot(); const a0 = player.ang; parts.push({ x: player.x + Math.cos(a0) * 16, y: player.y + Math.sin(a0) * 16, vx: 0, vy: 0, life: 0.05, max: 0.05, col: COL.white, size: n > 1 ? 8 : 5 });
}

    if (!s) { ctx.fillStyle = COL.mut; ctx.font = '700 22px sans-serif'; ctx.fillText('＋', x + tw / 2, sy + 40); ctx.font = '500 10px -apple-system, "Hiragino Sans", sans-serif'; ctx.fillText(sh.phase === 'setup' ? '棚に置く' : '空', x + tw / 2, sy + 62); }
    else { const g = GOOD[s.id]; ctx.fillStyle = g.col; ctx.font = '700 18px -apple-system, "Hiragino Sans", sans-serif'; ctx.fillText(g.ch + ' ×' + s.n, x + tw / 2, sy + 28); ctx.fillStyle = COL.text; ctx.font = '600 11px -apple-system, "Hiragino Sans", sans-serif'; ctx.fillText(g.name, x + tw / 2, sy + 46); ctx.fillStyle = s.tier === 'low' ? COL.implant : s.tier === 'high' ? COL.doorClosed : COL.scrap; ctx.font = '700 12px Menlo, monospace'; ctx.fillText(TUNE.shop.tiers[s.tier].label + ' Cr ' + s.price, x + tw / 2, sy + 66); }
  });
  // 土間＝客が歩く
  const fy = sy + th + 10, fh = Math.max(120, L.h - L.sab - 200 - fy);
  ctx.fillStyle = 'rgba(255,255,255,0.03)'; ctx.fillRect(x0, fy, w, fh); ctx.strokeStyle = '#1f2c4c'; ctx.strokeRect(x0 + 0.5, fy + 0.5, w - 1, fh - 1);
  ctx.fillStyle = COL.mut; ctx.font = '500 10px -apple-system, "Hiragino Sans", sans-serif'; ctx.textAlign = 'center'; ctx.fillText('入口', x0 + w / 2, fy + fh - 6);
  for (const c of sh.custs) { const tx = c.i >= 0 ? x0 + c.i * (tw + gap) + tw / 2 : x0 + w / 2, ty = fy + 18, ex = x0 + w / 2, ey = fy + fh - 16;
    let k = c.st === 'walk' ? Math.min(1, c.t / TUNE.shop.walkT) : c.st === 'react' ? 1 : 1 - Math.min(1, c.t / 0.6); const px = ex + (tx - ex) * k, py = ey + (ty - ey) * k;
    ctx.fillStyle = '#2b3d6b'; ctx.beginPath(); ctx.arc(px, py, 9, 0, 6.2832); ctx.fill(); ctx.strokeStyle = COL.text; ctx.lineWidth = 1.5; ctx.stroke();
    if (c.st === 'react' && c.text) { ctx.fillStyle = c.col; ctx.font = '700 12px -apple-system, "Hiragino Sans", sans-serif'; ctx.textAlign = 'center'; ctx.fillText(c.text, px, py - 16); if (c.say) { ctx.fillStyle = COL.mut; ctx.font = '500 10px -apple-system, "Hiragino Sans", sans-serif'; ctx.fillText('「' + c.say + '」', px, py + 24); } } }
  // 記録
  ctx.textAlign = 'left'; ctx.fillStyle = COL.mut; ctx.font = '500 11px -apple-system, "Hiragino Sans", sans-serif'; sh.log.slice(0, 4).forEach((t, i) => ctx.fillText(t, x0 + 8, fy + fh - 66 + i * 14));   // 記録＝土間の下側（客の反応は上側の棚のそば）
  ctx.textAlign = 'right'; ctx.fillText(sh.phase === 'setup' ? '棚をタップして品を置く' : sh.phase === 'open' ? '客 ' + sh.served + '/' + TUNE.shop.customers : '閉店', x0 + w - 8, fy + 16);
  // 下のボタン／品の選択／値付け
  let y = L.h - L.sab - 180;
  if (sh.phase === 'setup' && sh.pick !== null) {
    if (sh.tier === null) {   // 品を選ぶ
      const avail = GOODS.filter(g => (S.warehouse[g.id] | 0) > 0);
      if (!avail.length) { centerText('倉庫に品がない', y + 20, '600 14px -apple-system, "Hiragino Sans", sans-serif', COL.mut); button('やめる', y + 40, () => { sh.pick = null; }); return; }
      centerText('棚 ' + (sh.pick + 1) + ' に置く品を選ぶ', y - 6, '600 13px -apple-system, "Hiragino Sans", sans-serif');
      const ny = tileGrid(avail.map(g => ({ ch: g.ch, name: g.name, sub: '×' + (S.warehouse[g.id] | 0) + '　Cr ' + g.base, col: g.col, act: () => { sh.tier = g.id; } })), y + 4, 2);
      button('やめる', ny + 4, () => { sh.pick = null; });
    } else {   // 値付け（sh.tier に品idを一時的に入れている）
      const g = GOOD[sh.tier]; centerText(g.name + '　基準 Cr ' + g.base + '　値付けを選ぶ', y - 6, '600 13px -apple-system, "Hiragino Sans", sans-serif', g.col);
      const bw = (Math.min(340, L.w - 32) - 16) / 3, bx0 = (L.w - Math.min(340, L.w - 32)) / 2;
      [['low', COL.implant], ['mid', COL.scrap], ['high', COL.doorClosed]].forEach(([t, col], i) => { const x = bx0 + i * (bw + 8), tr = TUNE.shop.tiers[t]; UI.push({ x, y: y + 4, w: bw, h: 56, act: () => { shelfPut(sh.pick, g.id, t); sh.pick = null; sh.tier = null; } });
        ctx.fillStyle = 'rgba(255,255,255,0.07)'; ctx.fillRect(x, y + 4, bw, 56); ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.strokeRect(x + 0.5, y + 4.5, bw - 1, 55);
        ctx.textAlign = 'center'; ctx.fillStyle = col; ctx.font = '700 16px -apple-system, "Hiragino Sans", sans-serif'; ctx.fillText(tr.label + '　Cr ' + Math.round(g.base * tr.k), x + bw / 2, y + 28); ctx.fillStyle = COL.mut; ctx.font = '500 10px -apple-system, "Hiragino Sans", sans-serif'; ctx.fillText(t === 'low' ? 'ほぼ全員が買う' : t === 'mid' ? '多くが買う' : '買う人は少ない', x + bw / 2, y + 48); });
      button('やめる', y + 70, () => { sh.pick = null; sh.tier = null; });
    }
    return;
  }
  if (sh.phase === 'setup') { y = button('開店', y, () => shopOpen(), shopStocked().length ? COL.shop : null, shopStocked().length ? '客が ' + TUNE.shop.customers + ' 人来る。棚の品をタップで倉庫へ戻す' : '棚に品を置いてから'); y = button('戻る', y, () => shopClose()); }
  else if (sh.phase === 'open') { y = button('閉店（早じまい）', y, () => shopClose(), null, '売れ残りは倉庫へ戻る'); }
  else { centerText('本日の売上　Cr ' + sh.sales + '　（' + sh.soldN + ' 個）', y + 16, '700 16px -apple-system, "Hiragino Sans", sans-serif', COL.scrap); y = button('閉店して戻る', y + 34, () => shopClose(), COL.shop, '売れ残りは倉庫へ戻る。1日進む'); }
}
function draw() {
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, L.w, L.h);
  if (G.tiles) drawWorld();
  drawStick(); drawHUD(); drawOverlays();
}

// ---------- 計器（1フレームのJS処理時間）----------
const M = { js: [], dts: [], avg: 0, max: 0, fps: 0 };
function meter(js, dt) { M.js.push(js); M.dts.push(dt); if (M.js.length > 60) { M.js.shift(); M.dts.shift(); } if (M.js.length % 10 === 0) { let s = 0, mx = 0, sd = 0; for (let i = 0; i < M.js.length; i++) { s += M.js[i]; if (M.js[i] > mx) mx = M.js[i]; sd += M.dts[i]; } M.avg = s / M.js.length; M.max = mx; M.fps = sd > 0 ? Math.round(M.js.length / sd) : 0; } }

// ---------- メインループ ----------
let last = performance.now();
function frame(t) {
  requestAnimationFrame(frame); const t0 = performance.now(); let dt = (t - last) / 1000; last = t; if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
  if (G.mode === 'run') update(dt); else if (G.mode === 'home') updateHome(dt); else if (G.mode === 'shop') updateShop(dt); else if (G.mode === 'dead' || G.mode === 'floorclear' || G.mode === 'win') updateFx(dt);
  draw(); meter(performance.now() - t0, dt); if ((M.js.length % 30) === 0) relayoutIfChanged();
}

// ---------- デバッグ用フック（PC確認用・ゲームには影響しない）----------
const PR = window.PR = { get G() { return G; }, player, get enemies() { return enemies; }, get S() { return S; }, M, D, newRun, nextFloor, resumeRun, loadRun, saveRun, clearRun, genFloor, god: false, forced: null,
  setInput(x, y) { PR.forced = (x === null) ? null : { x, y }; }, killRoom() { while (enemies.length) killEnemy(enemies.length - 1); },
  step(n) { for (let i = 0; i < n; i++) { if (G.mode === 'run') update(1 / 60); else if (G.mode === 'home') updateHome(1 / 60); else if (G.mode === 'shop') updateShop(1 / 60); else updateFx(1 / 60); } draw(); }, draw, TUNE, PARTS, startDash, stickRelease, get L() { return L; }, warp(dir) { const nb = neighbor(G.room, dir); if (nb) enterRoom(nb, OPP[dir]); return !!nb; }, press, layout, get UI() { return UI; }, pickChoice, applyPart, PART, freeNear, enterRoom,
  GOODS, GUNS, GUN, GOOD, NPC, enterHome, returnHome, leaveDungeon, openHome, closeHome, openShop, shelfPut, shelfClear, shopOpen, shopClose, buyGun, equipGun, pickGood, swapPick, spawnGoods, spawnGoodsAround, holdPickups, exportData, importData, wareCount, bagValue, save, get bullets() { return bullets; },
  SKILLS, SLOTS, GEAR, GEARM, FRAMES, FRAME, lv, permLv, patchLv, canPatch, computePerm, bagCap, craftGear, equipGear, forgeGun, awardMold, roomGoods, treasureGoods, bossGoods, exitInfo, missingFor, permList, migrateS, spawnEnemies, IMG, IMG_FILES, loadSprites, drawSprite };

// ---------- 起動 ----------
layout(); loadSprites();
if (!G.tiles) { /* タイトル背景＝印刷所 */ G.room = HOME_ROOM; G.tiles = homeTiles(); G.open = true; renderStatic(); }
G.saved = loadRun();
requestAnimationFrame(frame);
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) { navigator.serviceWorker.register('./sw.js').catch(() => { }); }
</script>
